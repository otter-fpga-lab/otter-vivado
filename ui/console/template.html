<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Vivado 控制台 · Otter Vivado</title>
  <!-- __INLINE_CSS__ -->
</head>
<body>
  <div id="app" class="app-shell">
    <header class="telemetry-header">
      <div class="header-top-row">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 28 28" width="22" height="22" fill="none">
              <rect x="7" y="7" width="14" height="14" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
              <path d="M11 3v4M17 3v4M11 21v4M17 21v4M3 11h4M3 17h4M21 11h4M21 17h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M10.5 15.5h2l1.2-3.5 1.6 5 1.2-2.5H17.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="brand-copy">
            <div class="brand-title-row">
              <h1>Vivado 控制台</h1>
              <span id="conn-badge" class="conn-pill" data-state="connecting">连接中</span>
            </div>
            <p id="header-subtitle" class="header-sub">聚合 Runs · Batch/OOC · 离线工程 · ILA 调试</p>
          </div>
        </div>

        <div class="header-controls">
          <div class="summary-chips" id="summary-chips">
            <button type="button" class="sum-chip" data-filter="running" id="chip-running" title="筛选运行中任务">
              <span class="led led-running"></span>
              <span>运行中</span>
              <strong id="cnt-running">0</strong>
            </button>
            <button type="button" class="sum-chip" data-filter="completed" id="chip-completed" title="筛选已完成任务">
              <span class="led led-ok"></span>
              <span>已完成</span>
              <strong id="cnt-completed">0</strong>
            </button>
            <button type="button" class="sum-chip" data-filter="failed" id="chip-failed" title="筛选异常任务">
              <span class="led led-fail"></span>
              <span>异常</span>
              <strong id="cnt-failed">0</strong>
            </button>
          </div>

          <div class="action-buttons">
            <label class="auto-toggle" title="每 5 秒自动静默刷新状态">
              <input type="checkbox" id="auto-refresh-toggle" checked />
              <span>自动 5s</span>
            </label>
            <button type="button" id="btn-refresh" class="btn btn-secondary">刷新</button>
            <button type="button" id="btn-clear-finished" class="btn btn-ghost" hidden>清理已完成</button>
          </div>
        </div>
      </div>

      <div id="inspect-form" class="inspect-bar" role="search">
        <div class="inspect-input-wrap">
          <svg class="inspect-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true">
            <path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.2 1.5h4.8A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5v-7Z" stroke="currentColor" stroke-width="1.3"/>
          </svg>
          <input
            id="inspect-input"
            type="text"
            autocomplete="off"
            placeholder="输入 .xpr 或报告目录路径，零 Token 查看"
            aria-label="输入 .xpr 或报告目录路径，零 Token 查看"
          />
        </div>
        <button type="button" id="btn-inspect" class="btn btn-primary">检视目录</button>
      </div>

      <div id="toast-banner" class="toast-banner" role="status" aria-live="polite" hidden></div>
    </header>

    <main id="workspace-main" class="workspace-grid">
      <aside class="left-rail" aria-label="任务与目标导航">
        <div class="rail-toolbar">
          <input id="rail-search" type="search" placeholder="过滤目标 / Top / Part..." aria-label="过滤目标" />
        </div>
        <div id="rail-list" class="rail-list"></div>
      </aside>

      <section class="detail-stage" aria-label="详情工作区">
        <div id="empty-stage" class="empty-stage" hidden></div>

        <div id="detail-shell" class="detail-shell" hidden>
          <div id="detail-hero" class="detail-hero"></div>

          <nav class="tab-bar" role="tablist" aria-label="控制台视图">
            <button type="button" class="tab-btn" role="tab" data-tab="overview" aria-selected="true">总览</button>
            <button type="button" class="tab-btn" role="tab" data-tab="diagnostics" aria-selected="false">
              告警与错误 <span id="tab-diag-badge" class="tab-badge" hidden>0</span>
            </button>
            <button type="button" class="tab-btn" role="tab" data-tab="reports" aria-selected="false">
              报告与日志 <span id="tab-rpt-badge" class="tab-badge" hidden>0</span>
            </button>
            <button type="button" class="tab-btn" role="tab" data-tab="sessions" aria-selected="false">
              调试与会话 <span id="tab-sess-badge" class="tab-badge" hidden>0</span>
            </button>
          </nav>

          <div id="tab-panel-overview" class="tab-panel" role="tabpanel"></div>
          <div id="tab-panel-diagnostics" class="tab-panel" role="tabpanel" hidden></div>
          <div id="tab-panel-reports" class="tab-panel" role="tabpanel" hidden></div>
          <div id="tab-panel-sessions" class="tab-panel" role="tabpanel" hidden></div>
        </div>
      </section>
    </main>
  </div>
  <!-- __INLINE_JS__ -->
</body>
</html>
