<body>
  <div id="app" class="app-shell">
    <header class="titlebar">
      <div class="titlebar-left">
        <div class="app-title" title="Vivado 控制台">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="2.5" stroke="currentColor" stroke-width="1.6"/>
            <path d="M9.5 2.5v3.5M14.5 2.5v3.5M9.5 18v3.5M14.5 18v3.5M2.5 9.5H6M2.5 14.5H6M18 9.5h3.5M18 14.5h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M9 13.2h1.7l1-3 1.4 4.2 1-2.2H15" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Vivado 控制台</span>
        </div>
      </div>

      <div class="island-slot">
        <button type="button" id="dynamic-island" class="link-island idle" title="点击跳转到运行中任务或刷新状态">
          <span class="island-dot" aria-hidden="true"></span>
          <span id="island-title" class="island-title">就绪</span>
          <span class="island-divider" aria-hidden="true"></span>
          <span id="island-detail" class="island-mode">等待数据</span>
          <span id="island-meter" class="island-meter" aria-hidden="true" hidden><i></i><i></i><i></i><i></i></span>
          <span id="island-badge" class="island-badge" hidden></span>
        </button>
      </div>

      <div class="titlebar-right">
        <div id="theme-menu-wrap" class="menu-wrap">
          <button
            type="button"
            id="btn-theme"
            class="theme-trigger island-trigger"
            title="切换外观主题"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <span id="theme-trigger-swatch" class="theme-preview-mini" data-swatch="macos" aria-hidden="true">
              <i></i><i></i><i></i><i></i>
            </span>
            <span id="theme-trigger-name" class="theme-trigger-name">macOS 深色</span>
            <svg class="theme-chevron" viewBox="0 0 12 12" width="10" height="10" fill="none" aria-hidden="true">
              <path d="M3 4.5 6 7.5 9 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div id="theme-menu" class="menu island-menu menu-right theme-menu" role="menu" hidden></div>
        </div>

        <button
          type="button"
          id="btn-auto-notify"
          class="notify-toggle"
          title="构建完成/失败/卡死时自动发送 1 行摘要唤醒当前对话"
          aria-pressed="false"
          aria-label="提醒对话"
          hidden
        >
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" aria-hidden="true">
            <path d="M4.2 6.8a3.8 3.8 0 0 1 7.6 0c0 2.6.9 3.7 1.4 4.2H2.8c.5-.5 1.4-1.6 1.4-4.2Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/>
            <path d="M6.6 12.6a1.5 1.5 0 0 0 2.8 0" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
          </svg>
          <span class="notify-toggle-label">提醒</span>
        </button>

        <button
          type="button"
          id="btn-auto-refresh"
          class="tool-btn on"
          title="自动 5s 静默刷新（点击切换）"
          aria-pressed="true"
          aria-label="自动 5s 静默刷新"
        >
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.35"/>
            <path d="M8 4.8V8l2.2 1.4" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button
          type="button"
          id="btn-refresh"
          class="tool-btn"
          title="立即刷新状态"
          aria-label="立即刷新状态"
        >
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true">
            <path d="M13 8a5 5 0 1 1-1.35-3.42" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
            <path d="M13.2 2.6v2.7h-2.7" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="workspace-main" class="app-main">
      <aside class="sidebar" aria-label="目标与任务导航">
        <div class="sidebar-top">
          <div class="search-field">
            <svg class="search-icon" viewBox="0 0 16 16" width="13" height="13" fill="none" aria-hidden="true">
              <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/>
              <path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <input id="rail-search" type="search" placeholder="过滤目标 / Top / Part…" aria-label="过滤目标" />
          </div>

          <div class="filter-bar" id="summary-chips">
            <button type="button" class="filter-chip" data-filter="" data-active="true">全部 <strong id="cnt-all">0</strong></button>
            <button type="button" class="filter-chip" data-filter="running" id="chip-running"><span class="led led-running"></span>运行 <strong id="cnt-running">0</strong></button>
            <button type="button" class="filter-chip" data-filter="completed" id="chip-completed"><span class="led led-ok"></span>完成 <strong id="cnt-completed">0</strong></button>
            <button type="button" class="filter-chip" data-filter="failed" id="chip-failed"><span class="led led-fail"></span>异常 <strong id="cnt-failed">0</strong></button>
          </div>

          <div class="filter-bar client-filter-bar" id="client-filter-bar" aria-label="按来源智能体过滤" hidden></div>
        </div>

        <div id="rail-list" class="sidebar-scroll"></div>

        <div class="sidebar-footer">
          <div id="inspect-form" class="inspect-box" role="search">
            <input
              id="inspect-input"
              class="text-field mono"
              type="text"
              autocomplete="off"
              placeholder="检视 .xpr 或报告目录…"
              aria-label="输入 .xpr 或报告目录路径，零 Token 查看"
            />
            <button type="button" id="btn-inspect" class="btn primary">检视</button>
          </div>
          <div class="sidebar-footer-actions" id="sidebar-footer-actions" hidden>
            <button type="button" id="btn-clear-finished" class="ug-link-btn">清理已结束任务</button>
          </div>
        </div>
      </aside>

      <section class="pane main-pane" aria-label="详情工作区">
        <div id="toast-banner" class="toast-banner" role="status" aria-live="polite" hidden></div>

        <div id="empty-stage" class="detail-stage empty-stage-wrap" hidden></div>

        <div id="detail-shell" class="detail-shell" hidden>
          <div id="pane-bar" class="pane-bar">
            <div class="pane-bar-left">
              <span id="pane-title" class="pane-title"></span>
              <span id="pane-status-pill" class="status-badge"></span>
              <span id="pane-client-pill" class="client-pill" hidden></span>
              <span id="pane-kind-meta" class="pane-meta-text"></span>
            </div>

            <div class="seg seg-sm pane-tabs" role="tablist" aria-label="控制台视图">
              <button type="button" class="tab-btn active" role="tab" data-tab="overview" aria-selected="true">总览</button>
              <button type="button" class="tab-btn" role="tab" data-tab="diagnostics" aria-selected="false">告警 <span id="tab-diag-badge" class="seg-badge" hidden>0</span></button>
              <button type="button" class="tab-btn" role="tab" data-tab="reports" aria-selected="false">报告 <span id="tab-rpt-badge" class="seg-badge" hidden>0</span></button>
              <button type="button" class="tab-btn" role="tab" data-tab="sessions" aria-selected="false">进程与调试 <span id="tab-sess-badge" class="seg-badge" hidden>0</span></button>
            </div>

            <div id="pane-actions" class="pane-actions"></div>
          </div>

          <div id="detail-stage" class="detail-stage">
            <div id="tab-panel-overview" class="tab-panel" role="tabpanel"></div>
            <div id="tab-panel-diagnostics" class="tab-panel" role="tabpanel" hidden></div>
            <div id="tab-panel-reports" class="tab-panel" role="tabpanel" hidden></div>
            <div id="tab-panel-sessions" class="tab-panel" role="tabpanel" hidden></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="status-bar">
      <span id="sb-transport" class="sb-item sb-pill">MCP App</span>
      <span id="sb-local-wrap" class="sb-local-wrap" hidden>
        <button
          type="button"
          id="btn-sb-copy-url"
          class="sb-local-pill mono"
          title="点击复制本机控制台地址"
          aria-label="复制本机服务地址"
        >
          <span class="sb-local-dot" aria-hidden="true"></span>
          <span id="sb-local-addr" class="sb-local-addr">127.0.0.1:0</span>
          <span id="sb-shared-badge" class="sb-shared-badge" hidden>共享</span>
          <span id="sb-local-copied" class="sb-local-copied" hidden>已复制</span>
        </button>
        <button
          type="button"
          id="btn-sb-open-browser"
          class="sb-local-open"
          title="在系统浏览器打开 Vivado 控制台"
          aria-label="在浏览器打开"
          hidden
        >↗</button>
      </span>
      <span id="conn-badge" class="sb-item sb-conn" data-state="connecting">连接中</span>
      <div class="right">
        <span id="sb-sys-wrap" class="sb-sys-wrap" data-level="normal" hidden>
          <span class="sb-ram-bar" aria-hidden="true"><span id="sb-ram-fill" class="sb-ram-fill"></span></span>
          <span id="sb-ram-text" class="sb-item sb-ram-text mono"></span>
        </span>
        <button
          type="button"
          id="btn-sb-orphans"
          class="sb-orphan-pill"
          title="点击查看并处理疑似残留 EDA 进程"
          hidden
        ></button>
        <span id="sb-vivado" class="sb-item sb-vivado">0 个 Vivado</span>
        <span class="sb-sep sb-hint" aria-hidden="true">·</span>
        <span class="sb-item sb-hint">零 Token 本地查看</span>
        <span class="sb-sep sb-theme-item" aria-hidden="true">·</span>
        <span id="sb-theme" class="sb-item sb-theme-item">macOS 深色</span>
      </div>
    </footer>
  </div>
  <!-- CONSOLE_SCRIPT -->
