  <div id="app" class="app-shell">
    <header class="telemetry-header">
      <div class="header-top-row">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 28 28" width="22" height="22" fill="none">
              <rect x="7" y="7" width="14" height="14" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
              <path d="M11 3v4M17 3v4M11 21v4M17 21v4M3 11h4M3 17h4M21 11h4M21 17h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M10.5 15.5h2l1.2-3.5 1.6 5 1.2-2.5H17.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="brand-copy">
            <div class="brand-title-row">
              <h1>Vivado 控制台</h1>
              <span id="conn-badge" class="conn-pill" data-state="connecting">连接中</span>
            </div>
            <p id="header-subtitle" class="header-sub">聚合 Runs · Batch/OOC · 离线工程 · ILA 调试</p>
          </div>
        </div>

        <div class="header-controls">
          <div class="summary-chips" id="summary-chips">
            <button type="button" class="sum-chip" data-filter="running" id="chip-running" title="筛选运行中任务">
              <span class="led led-running"></span>
              <span>运行中</span>
              <strong id="cnt-running">0</strong>
            </button>

              <span>已完成</span>
              <strong id="cnt-completed">0</strong>
            </button>
            <button type="button" class="sum-chip" data-filter="failed" id="chip-failed" title="筛选异常任务">
              <span class="led led-fail"></span>
              <span>异常</span>
              <strong id="cnt-failed">0</strong>
            </button>
          </div>

          <div class="action-buttons">
            <label class="auto-toggle" title="每 5 秒自动静默刷新状态">

            </label>
            <button type="button" id="btn-refresh" class="btn btn-secondary">刷新</button>
            <button type="button" id="btn-clear-finished" class="btn btn-ghost" hidden>清理已完成</button>
          </div>
        </div>
      </div>

      <div id="inspect-form" class="inspect-bar" role="search">

            <path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.2 1.5h4.8A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5v-7Z" stroke="currentColor" stroke-width="1.3"/>

          <input

            type="text"
            autocomplete="off"
            placeholder="输入 .xpr 或报告目录路径，零 Token 查看"

          />
        </div>
        <button type="button" id="btn-inspect" class="btn btn-primary">检视目录</button>
      </div>

      <div id="toast-banner" class="toast-banner" role="status" aria-live="polite" hidden></div>

        </div>
      </section>
    </main>
