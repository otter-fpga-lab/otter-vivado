[project]
name = "vivado-mcp"
version = "0.3.25"
description = "Otter Vivado — 本机 Vivado 工程、执行、仿真、IP、真实运行状态与报告工具，支持原生 GUI 和 MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "NJ" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "vivado",
    "fpga",
    "eda",
    "tcl",
    "verilog",
    "xilinx",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "mcp>=2.0.0,<3",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/otter-fpga-lab/otter-vivado"
Repository = "https://github.com/otter-fpga-lab/otter-vivado"
Feedback = "https://github.com/otter-fpga-lab/otter-vivado/pull/1"
Changelog = "https://github.com/otter-fpga-lab/otter-vivado/blob/main/CHANGELOG.md"
Upstream = "https://github.com/mapleleavessssssss-wq/vivado-mcp"

[project.scripts]
vivado-mcp = "vivado_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vivado_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/vivado_mcp_server.tcl" = "vivado_mcp/scripts/vivado_mcp_server.tcl"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
